name: MacaqueSVG
options:
  bundleIdPrefix: club.cycleruncode.macaque
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"
    ARCHS: arm64 x86_64
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  MacaqueSVG:
    type: application
    platform: macOS
    dependencies:
      - sdk: WebKit.framework
    sources:
      - path: MacaqueSVG
        excludes:
          - "**/.DS_Store"
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.cycleruncode.macaque.MacaqueSVG
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MacaqueSVG/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: "Prepare Version"
        basedOnDependencyAnalysis: false
        script: |
          if [ "${ACTION}" = "indexbuild" ]; then
            exit 0
          fi
          if [ -n "${SRCROOT}" ] && [ -d "${SRCROOT}" ]; then
            cd "${SRCROOT}"
          fi
          VERSION_SCRIPT="${SRCROOT}/scripts/version/manage_version.sh"
          if [ ! -f "${VERSION_SCRIPT}" ]; then
            VERSION_SCRIPT="$(pwd)/scripts/version/manage_version.sh"
          fi
          if [ -f "${VERSION_SCRIPT}" ]; then
            [ -n "${SRCROOT}" ] && export SRCROOT
            bash "${VERSION_SCRIPT}" prepare 2>&1
          fi
          mkdir -p "${TARGET_BUILD_DIR}" && touch "${TARGET_BUILD_DIR}/.prebuild_marker"
    postBuildScripts:
      - name: "Update Build Counts"
        basedOnDependencyAnalysis: false
        script: |
          set +e
          if [ "${ACTION}" = "indexbuild" ]; then
            exit 0
          fi
          if [ -n "${SRCROOT}" ] && [ -d "${SRCROOT}" ]; then
            cd "${SRCROOT}"
          fi
          VERSION_SCRIPT="${SRCROOT}/scripts/version/manage_version.sh"
          if [ ! -f "${VERSION_SCRIPT}" ]; then
            VERSION_SCRIPT="$(pwd)/scripts/version/manage_version.sh"
          fi
          if [ ! -f "${VERSION_SCRIPT}" ]; then
            echo "❌ ERROR: Version script not found at ${VERSION_SCRIPT}" >&2
            exit 0
          fi
          [ -n "${SRCROOT}" ] && export SRCROOT
          [ -n "${BUILT_PRODUCTS_DIR}" ] && export BUILT_PRODUCTS_DIR
          [ -n "${PRODUCT_NAME}" ] && export PRODUCT_NAME
          [ -n "${TARGET_BUILD_DIR}" ] && export TARGET_BUILD_DIR
          [ -n "${CONFIGURATION}" ] && export CONFIGURATION
          bash "${VERSION_SCRIPT}" success 2>&1

  MacaqueSVGTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacaqueSVGTests
    dependencies:
      - target: MacaqueSVG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.cycleruncode.macaque.MacaqueSVGTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacaqueSVG:
    build:
      targets:
        MacaqueSVG: all
        MacaqueSVGTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacaqueSVGTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
